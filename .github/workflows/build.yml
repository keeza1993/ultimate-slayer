name: Build and verify
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon build
      - run: ./gradlew --no-daemon verifyWikiLive
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-slayer-build
          path: |
            build/libs/*.jar
            build/*preview.png
      - name: Prepare flat source update
        run: |
          mkdir -p build/update-package
          git archive HEAD | tar -x -C build/update-package
          test -f build/update-package/build.gradle
          test -f build/update-package/gradlew.bat
          test -f build/update-package/src/main/java/com/imth3keeza0/ultimateslayer/SupplyPlanner.java
          test ! -d build/update-package/ultimate-slayer-main
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateSlayer-update
          path: build/update-package/
          include-hidden-files: true

